groups:
  - name: nurox-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: High error rate (P1)
          description: HTTP 5xx error rate is > 5% for 5 minutes.

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High Latency (P2)
          description: P95 latency is > 2s for 10 minutes.

      - alert: DBPoolExhaustion
        expr: max(go_sql_stats_connections_in_use) / max(go_sql_stats_connections_max_open) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Database Pool Exhaustion (P2)
          description: DB connection pool usage is > 80%.

      - alert: HighQueueDepth
        expr: queue_depth > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High Queue Depth (P2)
          description: Background job queue depth is > 1000 for 10 minutes.

      - alert: DiskSpaceAlmostFull
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Disk Space Almost Full (P1)
          description: Disk usage > 85%.

      - alert: SSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 1209600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: SSL Certificate Expiring Soon (P2)
          description: SSL cert expires in less than 14 days.
